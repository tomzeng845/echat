name: Build signed iOS IPA

on:
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version
        required: true
        default: "0.9.0"
        type: string
      build_number:
        description: Optional unique numeric build; defaults to 18 followed by the workflow run number
        required: false
        default: ""
        type: string
      api_url:
        description: Production EChat HTTPS API URL embedded in the app
        required: true
        default: "https://platform.superseller88.com:2099"
        type: string
      upload_testflight:
        description: Validate and upload this build to App Store Connect / TestFlight
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: echat-ios-ipa
  cancel-in-progress: false

jobs:
  build-signed-ipa:
    name: Archive and export EChat IPA
    # Use the public stable alias so GitHub can select an available hosted macOS image.
    runs-on: macos-latest
    timeout-minutes: 60
    environment: ios-production
    env:
      ECHAT_IOS_BUNDLE_ID: com.tomzeng845.echat
      ECHAT_IOS_VERSION: ${{ inputs.version }}
      ECHAT_IOS_BUILD_NUMBER: ${{ inputs.build_number != '' && inputs.build_number || format('18{0}', github.run_number) }}
      ECHAT_IOS_API_URL: ${{ inputs.api_url }}

    steps:
      - name: Check out EChat source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Use Node.js 22
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: "22"

      - name: Enable the project pnpm version
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.4.1 --activate
          node --version
          pnpm --version
          xcodebuild -version

      - name: Validate required signing secrets and inputs
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
          HAS_APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID != '' }}
          HAS_APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID != '' }}
          HAS_APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 != '' }}
          UPLOAD_TESTFLIGHT: ${{ inputs.upload_testflight }}
        run: |
          set -euo pipefail
          : "${APPLE_TEAM_ID:?Missing ios-production environment secret APPLE_TEAM_ID}"
          : "${BUILD_CERTIFICATE_BASE64:?Missing ios-production environment secret BUILD_CERTIFICATE_BASE64}"
          : "${P12_PASSWORD:?Missing ios-production environment secret P12_PASSWORD}"
          : "${BUILD_PROVISION_PROFILE_BASE64:?Missing ios-production environment secret BUILD_PROVISION_PROFILE_BASE64}"
          [[ "$APPLE_TEAM_ID" =~ ^[A-Za-z0-9]{10}$ ]] || { echo "APPLE_TEAM_ID must contain exactly 10 letters or digits." >&2; exit 2; }
          [[ "$ECHAT_IOS_VERSION" =~ ^[0-9]+(\.[0-9]+){1,2}$ ]] || { echo "Invalid iOS version." >&2; exit 2; }
          [[ "$ECHAT_IOS_BUILD_NUMBER" =~ ^[0-9]{1,18}$ ]] || { echo "Build number must contain 1-18 digits." >&2; exit 2; }
          [[ "$ECHAT_IOS_API_URL" =~ ^https://[^[:space:]]+$ ]] || { echo "The embedded API URL must use HTTPS." >&2; exit 2; }
          if [[ "$UPLOAD_TESTFLIGHT" == "true" ]]; then
            [[ "$HAS_APP_STORE_CONNECT_KEY_ID" == "true" ]] || { echo "Missing ios-production environment secret APP_STORE_CONNECT_KEY_ID." >&2; exit 2; }
            [[ "$HAS_APP_STORE_CONNECT_ISSUER_ID" == "true" ]] || { echo "Missing ios-production environment secret APP_STORE_CONNECT_ISSUER_ID." >&2; exit 2; }
            [[ "$HAS_APP_STORE_CONNECT_API_KEY" == "true" ]] || { echo "Missing ios-production environment secret APP_STORE_CONNECT_API_KEY_BASE64." >&2; exit 2; }
          fi

      - name: Install JavaScript dependencies
        shell: bash
        run: pnpm install --frozen-lockfile

      - name: Install Apple Distribution certificate and profile
        id: signing
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
          BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          CERTIFICATE_PATH="$RUNNER_TEMP/echat_distribution.p12"
          PROFILE_PATH="$RUNNER_TEMP/echat_app_store.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/echat_profile.plist"
          KEYCHAIN_PATH="$RUNNER_TEMP/echat-signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"

          printf '%s' "$BUILD_CERTIFICATE_BASE64" | base64 --decode -o "$CERTIFICATE_PATH"
          printf '%s' "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode -o "$PROFILE_PATH"
          chmod 600 "$CERTIFICATE_PATH" "$PROFILE_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -P "$P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | tee "$RUNNER_TEMP/echat-identities.txt"
          grep -q 'Apple Distribution:' "$RUNNER_TEMP/echat-identities.txt" || { echo "The p12 does not contain an Apple Distribution signing identity." >&2; exit 3; }

          security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$PROFILE_PLIST")"
          python3 scripts/validate-apple-profile.py "$PROFILE_PLIST" "$APPLE_TEAM_ID" "$ECHAT_IOS_BUNDLE_ID"

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$PROFILE_UUID" > "$RUNNER_TEMP/echat-profile-uuid"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

          echo "profile_uuid=$PROFILE_UUID" >> "$GITHUB_OUTPUT"

      - name: Validate and synchronize Capacitor iOS project
        shell: bash
        run: |
          set -euo pipefail
          pnpm ios:sync
          pod install --project-directory=ios/App --repo-update
          pnpm ios:validate
          pnpm exec tsc --noEmit

      - name: Resolve Swift packages
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -workspace ios/App/App.xcworkspace \
            -scheme App

      - name: Archive and export signed IPA
        id: archive
        shell: bash
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE_UUID: ${{ steps.signing.outputs.profile_uuid }}
        run: |
          set -euo pipefail
          DERIVED="$RUNNER_TEMP/ios-ipa"
          ARCHIVE="$DERIVED/EChat.xcarchive"
          EXPORT_DIR="$DERIVED/export"
          EXPORT_OPTIONS="$DERIVED/ExportOptions.plist"
          mkdir -p "$EXPORT_DIR" releases

          cat > "$EXPORT_OPTIONS" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>destination</key>
            <string>export</string>
            <key>signingCertificate</key>
            <string>Apple Distribution</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key>
            <false/>
            <key>stripSwiftSymbols</key>
            <true/>
            <key>uploadSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

          PROFILE_UUID="$PROFILE_UUID" python3 - <<'PY'
          import os
          from pathlib import Path

          project = Path("ios/App/App.xcodeproj/project.pbxproj")
          text = project.read_text()
          profile = os.environ["PROFILE_UUID"]
          text = text.replace(
              "CODE_SIGN_STYLE = Automatic;",
              f"CODE_SIGN_STYLE = Manual;\n\t\t\t\tCODE_SIGN_IDENTITY = \"Apple Distribution\";\n\t\t\t\tPROVISIONING_PROFILE_SPECIFIER = {profile};",
          )
          project.write_text(text)
          PY

          xcodebuild \
            -workspace ios/App/App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            MARKETING_VERSION="$ECHAT_IOS_VERSION" \
            CURRENT_PROJECT_VERSION="$ECHAT_IOS_BUILD_NUMBER" \
            clean archive

          # Embedded frameworks must never carry the app provisioning profile.
          # Preserve the profile on the .app bundle, remove every other copy,
          # then restore the app profile for export signing.
          APP_BUNDLE="$(find "$ARCHIVE/Products/Applications" -maxdepth 1 -name '*.app' -print -quit)"
          cp "$APP_BUNDLE/embedded.mobileprovision" "$RUNNER_TEMP/app.mobileprovision"
          find "$ARCHIVE/Products/Applications" -name embedded.mobileprovision -delete
          cp "$RUNNER_TEMP/app.mobileprovision" "$APP_BUNDLE/embedded.mobileprovision"

          # The archive is already signed and contains the app provisioning
          # profile. Package that signed app directly; Xcode exportArchive
          # incorrectly tries to apply the app profile to libwebp.framework.
          rm -rf "$EXPORT_DIR/Payload"
          mkdir -p "$EXPORT_DIR/Payload"
          ditto "$APP_BUNDLE" "$EXPORT_DIR/Payload/$(basename "$APP_BUNDLE")"
          IPA="$EXPORT_DIR/EChat-iOS.ipa"
          (cd "$EXPORT_DIR" && /usr/bin/zip -qry "$IPA" Payload)
          [[ -s "$IPA" ]] || { echo "Packaged IPA was not found." >&2; exit 4; }
          ARTIFACT="releases/EChat-iOS-${ECHAT_IOS_VERSION}-${ECHAT_IOS_BUILD_NUMBER}.ipa"
          cp "$IPA" "$ARTIFACT"
          ARTIFACT_BASENAME="$(basename "$ARTIFACT")"
          (cd releases && shasum -a 256 "$ARTIFACT_BASENAME" > "$ARTIFACT_BASENAME.sha256")

          VERIFY_DIR="$RUNNER_TEMP/verify-ipa"
          rm -rf "$VERIFY_DIR"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$ARTIFACT" -d "$VERIFY_DIR"
          APP_PATH="$(find "$VERIFY_DIR/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          [[ -n "$APP_PATH" ]] || { echo "The IPA does not contain an app bundle." >&2; exit 4; }
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          security cms -D -i "$APP_PATH/embedded.mobileprovision" > "$RUNNER_TEMP/exported-profile.plist"
          python3 scripts/validate-apple-profile.py "$RUNNER_TEMP/exported-profile.plist" "$APPLE_TEAM_ID" "$ECHAT_IOS_BUNDLE_ID"
          ACTUAL_BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_PATH/Info.plist")"
          ACTUAL_VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_PATH/Info.plist")"
          ACTUAL_BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_PATH/Info.plist")"
          [[ "$ACTUAL_BUNDLE_ID" == "$ECHAT_IOS_BUNDLE_ID" ]] || { echo "IPA Bundle ID mismatch." >&2; exit 4; }
          [[ "$ACTUAL_VERSION" == "$ECHAT_IOS_VERSION" ]] || { echo "IPA version mismatch." >&2; exit 4; }
          [[ "$ACTUAL_BUILD" == "$ECHAT_IOS_BUILD_NUMBER" ]] || { echo "IPA build number mismatch." >&2; exit 4; }

          BUILD_INFO="releases/EChat-iOS-${ECHAT_IOS_VERSION}-${ECHAT_IOS_BUILD_NUMBER}-build.txt"
          cat > "$BUILD_INFO" <<INFO
          bundleId=$ACTUAL_BUNDLE_ID
          version=$ACTUAL_VERSION
          build=$ACTUAL_BUILD
          api=$ECHAT_IOS_API_URL
          profileUuid=$PROFILE_UUID
          generatedAtUtc=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          githubRunId=$GITHUB_RUN_ID
          githubRunAttempt=$GITHUB_RUN_ATTEMPT
          INFO

          {
            echo "artifact_name=EChat-iOS-${ECHAT_IOS_VERSION}-${ECHAT_IOS_BUILD_NUMBER}"
            echo "ipa_path=$ARTIFACT"
            echo "build_info_path=$BUILD_INFO"
          } >> "$GITHUB_OUTPUT"

      - name: Upload signed IPA artifact
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: ${{ steps.archive.outputs.artifact_name }}
          path: |
            ${{ steps.archive.outputs.ipa_path }}
            ${{ steps.archive.outputs.ipa_path }}.sha256
            ${{ steps.archive.outputs.build_info_path }}
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Validate and upload build to TestFlight
        if: ${{ inputs.upload_testflight }}
        shell: bash
        env:
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
          IPA_PATH: ${{ steps.archive.outputs.ipa_path }}
        run: |
          set -euo pipefail
          [[ "$APP_STORE_CONNECT_KEY_ID" =~ ^[A-Za-z0-9]{10}$ ]] || { echo "APP_STORE_CONNECT_KEY_ID must contain exactly 10 letters or digits." >&2; exit 5; }
          [[ "$APP_STORE_CONNECT_ISSUER_ID" =~ ^[A-Fa-f0-9-]{36}$ ]] || { echo "APP_STORE_CONNECT_ISSUER_ID must be a UUID." >&2; exit 5; }
          KEY_DIR="$HOME/.appstoreconnect/private_keys"
          KEY_PATH="$KEY_DIR/AuthKey_${APP_STORE_CONNECT_KEY_ID}.p8"
          mkdir -p "$KEY_DIR"
          chmod 700 "$KEY_DIR"
          printf '%s' "$APP_STORE_CONNECT_API_KEY_BASE64" | base64 --decode -o "$KEY_PATH"
          chmod 600 "$KEY_PATH"
          openssl pkey -in "$KEY_PATH" -noout >/dev/null 2>&1 || { echo "The App Store Connect private key is invalid." >&2; exit 5; }

          xcrun altool --validate-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

          xcrun altool --upload-app \
            --file "$IPA_PATH" \
            --type ios \
            --apiKey "$APP_STORE_CONNECT_KEY_ID" \
            --apiIssuer "$APP_STORE_CONNECT_ISSUER_ID"

      - name: Publish build summary
        shell: bash
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          IPA_PATH: ${{ steps.archive.outputs.ipa_path }}
        run: |
          {
            echo "## EChat signed iOS IPA"
            echo
            echo "| Field | Value |"
            echo "| --- | --- |"
            echo "| Bundle ID | \`$ECHAT_IOS_BUNDLE_ID\` |"
            echo "| Version | \`$ECHAT_IOS_VERSION\` |"
            echo "| Build | \`$ECHAT_IOS_BUILD_NUMBER\` |"
            echo "| API | \`$ECHAT_IOS_API_URL\` |"
            echo "| IPA | \`$IPA_PATH\` |"
            echo "| TestFlight upload requested | \`${{ inputs.upload_testflight }}\` |"
            echo
            echo "[Download the workflow artifact]($ARTIFACT_URL)"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Clean up signing material
        if: ${{ always() }}
        shell: bash
        run: |
          set +e
          KEYCHAIN_PATH="$RUNNER_TEMP/echat-signing.keychain-db"
          PROFILE_UUID=""
          if [[ -f "$RUNNER_TEMP/echat-profile-uuid" ]]; then
            PROFILE_UUID="$(cat "$RUNNER_TEMP/echat-profile-uuid")"
          fi
          if [[ -f "$KEYCHAIN_PATH" ]]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          if [[ -n "$PROFILE_UUID" ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          fi
          rm -f "$RUNNER_TEMP/echat_distribution.p12" \
                "$RUNNER_TEMP/echat_app_store.mobileprovision" \
                "$RUNNER_TEMP/echat_profile.plist" \
                "$RUNNER_TEMP/echat-identities.txt" \
                "$RUNNER_TEMP/echat-profile-uuid" \
                "$RUNNER_TEMP/exported-profile.plist"
          rm -f "$HOME/.appstoreconnect/private_keys"/AuthKey_*.p8
          rm -rf "$RUNNER_TEMP/ios-ipa" "$RUNNER_TEMP/verify-ipa"
